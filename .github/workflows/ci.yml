name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck

      # Build before test, not after: the e2e suite serves each widget's bundled
      # HTML out of dist/widgets, and on an unbuilt tree it silently downgrades
      # to asserting the "bundle missing" error instead. That downgrade is now a
      # hard failure under CI=true, so this ordering is pinned by the suite.
      - run: npm run build
      - run: npm test
