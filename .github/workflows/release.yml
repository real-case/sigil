name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # npm OIDC trusted publishing needs npm >= 11.5.1; Node 22 bundles npm 10.
      - run: npm install -g npm@latest

      - name: Guard — tag matches package.json version
        run: bash scripts/check-tag-version.sh

      - name: Guard — tagged commit is reachable from main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag $GITHUB_REF_NAME points at a commit not reachable from origin/main — releases are cut from main only" >&2
            exit 1
          fi

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: Publish to npm (skipped when the version is already on the registry)
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ -n "$(npm view "@real-case/sigil@${VERSION}" version 2>/dev/null || true)" ]; then
            echo "Version ${VERSION} is already on the registry — skipping publish"
          else
            npm publish
          fi

      - name: Create GitHub Release (idempotent)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --generate-notes
